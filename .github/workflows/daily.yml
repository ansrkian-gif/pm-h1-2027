name: Daily PM H1 dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (
        (github.actor == 'ansrkian-gif' || github.actor == 'aashiqsadiq-blip') &&
        (
          (github.event_name == 'issues' && contains(github.event.issue.title, 'refresh')) ||
          (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'refresh'))
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Close refresh request
        if: github.event_name == 'issues' || github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "Refresh started. Reload the phone page in 2-4 minutes (PIN 4221)."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/package.json
      - name: Install
        working-directory: cloud
        run: npm install && npx playwright install --with-deps chromium
      - name: Pull OWS extract
        working-directory: cloud
        env:
          OWS_URL: ${{ secrets.OWS_URL }}
          OWS_USER: ${{ secrets.OWS_USER }}
          OWS_PASS: ${{ secrets.OWS_PASS }}
          OWS_FROM: "2026-08-01 00:00:00"
          OWS_SEARCH: "_OGK Active and Passive"
        run: node fetch-ows.mjs
      - name: Build dashboard
        working-directory: cloud
        env:
          DASHBOARD_PIN: ${{ secrets.DASHBOARD_PIN }}
          OWS_URL: ${{ secrets.OWS_URL }}
        run: node process.mjs
      - name: Upload OWS screenshots if pull failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ows-debug
          path: |
            cloud/*.png
            cloud/*.txt
          if-no-files-found: ignore
      - name: Publish phone page
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --branch gh-pages --single-branch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" _site
          cp dashboard/index.html _site/index.html
          cp dashboard/manifest.json _site/manifest.json
          touch _site/.nojekyll
          cd _site
          git add index.html manifest.json .nojekyll
          git diff --cached --quiet && echo "No page changes" && exit 0
          git commit -m "Daily OWS dashboard refresh"
          git push
