name: Daily PM H1 dashboard

on:
  workflow_dispatch:
  schedule:
    # 17:00 UTC = 20:00 Kuwait
    - cron: "0 17 * * *"
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (
        (github.actor == 'ansrkian-gif' || github.actor == 'aashiqsadiq-blip') &&
        (
          (github.event_name == 'issues' && contains(github.event.issue.title, 'refresh')) ||
          (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'refresh'))
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Note refresh request
        if: github.event_name == 'issues' || github.event_name == 'issue_comment'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "Refresh started. You can lock the phone. The full-screen popup arrives when this finishes, about 3 minutes. Then open the dashboard and tap Reload." && exit 0
            sleep 8
          done
          echo "Could not post issue comment; continuing refresh anyway."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/package.json
      - name: Install
        working-directory: cloud
        run: npm install && npx playwright install --with-deps chromium
      - name: Pull OWS extract
        working-directory: cloud
        env:
          OWS_URL: ${{ secrets.OWS_URL }}
          OWS_USER: ${{ secrets.OWS_USER }}
          OWS_PASS: ${{ secrets.OWS_PASS }}
          OWS_FROM: "2026-08-01 00:00:00"
          OWS_SEARCH: "_OGK Active and Passive"
        run: node fetch-ows.mjs
      - name: Build NTE dashboard and ntfy
        env:
          EXTRACT_PATH: ${{ github.workspace }}/cloud/extract.xlsx
          DASHBOARD_PIN: ${{ secrets.DASHBOARD_PIN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PAGES_URL: https://ansrkian-gif.github.io/pm-h1-2027
        run: |
          python3 -m pip install --user openpyxl
          python3 scripts/extract_data.py
          python3 -c "import json,os; open('dashboard/pin.js','w',encoding='utf-8').write('window.DASHBOARD_PIN=' + json.dumps(os.environ.get('DASHBOARD_PIN','')) + ';\n')"
          STAMP=$(date +%s)
          sed -i "s/__BUILD_STAMP__/${STAMP}/g" dashboard/index.html dashboard/alert.html dashboard/site.html
          python3 scripts/daily_alert.py
      - name: Build November phone dashboard
        shell: pwsh
        env:
          EXTRACT_PATH: ${{ github.workspace }}/cloud/extract.xlsx
          DASHBOARD_PIN: ${{ secrets.DASHBOARD_PIN }}
          PAGES_URL: https://ansrkian-gif.github.io/pm-h1-2027/nov/
        run: ./scripts/Build-NovDashboard.ps1 -DashName nov
      - name: Upload OWS screenshots if pull failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ows-debug
          path: |
            cloud/*.png
            cloud/*.txt
          if-no-files-found: ignore
      - name: Publish phone page
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --branch gh-pages --single-branch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" _site
          cp dashboard/index.html dashboard/alert.html dashboard/site.html dashboard/sw.js dashboard/pin-gate.js dashboard/manifest.webmanifest dashboard/404.html _site/
          cp dashboard/dashboard-data.js dashboard/alert-data.js dashboard/site-lookup.js dashboard/pin.js _site/
          mkdir -p _site/issues/1 _site/nov
          cp dashboard/issues/1/index.html _site/issues/1/
          cp nov/index.html nov/alert.html nov/pin-gate.js nov/sw.js nov/manifest.webmanifest nov/404.html nov/dashboard-data.js nov/alert-data.js nov/pin.js nov/icon-192.png nov/icon-512.png _site/nov/
          touch _site/.nojekyll
          cd _site
          git add index.html alert.html site.html sw.js pin-gate.js pin.js manifest.webmanifest dashboard-data.js alert-data.js site-lookup.js 404.html issues/1/index.html .nojekyll
          git add nov
          git diff --cached --quiet && echo "No page changes" && exit 0
          git commit -m "Daily OWS dashboard refresh"
          git push
      - name: Send the phone popup
        if: success()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC is not set. Popup skipped."
            exit 0
          fi
          BASE="${NTFY_URL:-https://ntfy.sh}"
          BASE="${BASE%/}"
          CLICK="https://ansrkian-gif.github.io/pm-h1-2027/nov/alert.html"
          TITLE=$(tr -d '\r' < nov/ntfy-title.txt)
          AUTH=()
          if [ -n "$NTFY_TOKEN" ]; then AUTH=(-H "Authorization: Bearer $NTFY_TOKEN"); fi
          curl -fsS "${AUTH[@]}" \
            -H "Title: ${TITLE}" \
            -H "Priority: 5" \
            -H "Tags: rotating_light" \
            -H "Click: ${CLICK}" \
            -H "Actions: view, Open full screen, ${CLICK}, clear=true" \
            --data-binary @nov/ntfy-body.txt \
            "${BASE}/${NTFY_TOPIC}"
      - name: Close the refresh request
        if: success() && github.event_name == 'issues'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --reason completed
