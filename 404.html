<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Page not found</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #eef4f2;
      color: #142523;
      padding: 1.5rem;
    }
    .card {
      width: min(28rem, 100%);
      background: #fff;
      border-radius: 16px;
      padding: 1.4rem 1.2rem 1.5rem;
      box-shadow: 0 10px 30px rgba(15, 61, 62, 0.08);
    }
    h1 { margin: 0 0 0.6rem; font-size: 1.35rem; }
    p { margin: 0 0 1rem; color: #4a5c5a; line-height: 1.45; }
    a.btn {
      display: block;
      text-align: center;
      background: #0f6b66;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      padding: 0.9rem 1rem;
      border-radius: 999px;
      margin-bottom: 0.7rem;
    }
    a.alt { display: block; text-align: center; color: #0f6b66; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Wrong address</h1>
    <p>The phone dashboard has no extra pages. Refresh comments are on GitHub, not on this dashboard URL.</p>
    <a class="btn" href="https://github.com/ansrkian-gif/pm-h1-2027/issues/1">Open refresh comment page</a>
    <a class="alt" href="./">Back to dashboard</a>
  </div>
</body>
</html>
