<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <style>
    :root {
      --bg: #0b1220;
      --card: #141c2e;
      --line: #243049;
      --text: #f4f7fb;
      --muted: #93a0b8;
      --good: #3dd68c;
      --watch: #f5b942;
      --bad: #ff6b6b;
      --accent: #4c8dff;
      --pad: max(16px, env(safe-area-inset-left));
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    body { padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
    header {
      position: sticky; top: 0; z-index: 5;
      background: rgba(11,18,32,.92);
      backdrop-filter: blur(12px);
      padding: calc(12px + env(safe-area-inset-top)) var(--pad) 12px;
      border-bottom: 1px solid var(--line);
    }
    .kicker { color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    h1 { font-size: 22px; margin: 4px 0 0; font-weight: 700; }
    main { padding: 16px var(--pad) 0; max-width: 560px; margin: 0 auto; }
    .shape {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 10px; padding: 6px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 700;
    }
    .shape.GOOD { background: rgba(61,214,140,.15); color: var(--good); }
    .shape.WATCH { background: rgba(245,185,66,.15); color: var(--watch); }
    .shape.BAD { background: rgba(255,107,107,.15); color: var(--bad); }
    .kpis {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0;
    }
    .kpi {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 14px 14px 12px;
    }
    .kpi b { display: block; font-size: 26px; line-height: 1.1; }
    .kpi span { color: var(--muted); font-size: 12px; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 18px; padding: 14px; margin-bottom: 10px;
    }
    .card h2 { font-size: 13px; color: var(--muted); margin: 0 0 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
    .fme { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .fme-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .name { font-weight: 700; font-size: 16px; }
    .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .bar { height: 6px; background: #1e2940; border-radius: 99px; margin-top: 10px; overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: 99px; }
    .days {
      display: none; gap: 6px; overflow-x: auto; padding: 12px 0 2px;
      -webkit-overflow-scrolling: touch;
    }
    .fme.open .days { display: flex; }
    .chip {
      min-width: 52px; text-align: center; border-radius: 12px;
      padding: 8px 6px; font-size: 11px; background: #1a2336; color: var(--muted);
    }
    .chip b { display: block; font-size: 13px; color: var(--text); }
    .chip.hit { background: rgba(61,214,140,.14); }
    .chip.miss { background: rgba(255,107,107,.14); }
    .chip.empty { opacity: .45; }
    .row {
      display: flex; justify-content: space-between; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px;
    }
    .row:last-child { border-bottom: 0; }
    .muted { color: var(--muted); }
    footer { color: var(--muted); font-size: 12px; padding: 20px var(--pad); max-width: 560px; margin: 0 auto; line-height: 1.45; }
    .hint {
      background: #10192b; border: 1px dashed var(--line); border-radius: 14px;
      padding: 12px; font-size: 13px; color: var(--muted); margin: 8px 0 16px;
    }
    #lock {
      display: none; position: fixed; inset: 0; background: var(--bg); z-index: 20;
      padding: calc(48px + env(safe-area-inset-top)) 24px; text-align: center;
    }
    #lock input {
      width: 100%; max-width: 280px; margin-top: 16px; padding: 14px;
      border-radius: 12px; border: 1px solid var(--line); background: var(--card);
      color: var(--text); font-size: 18px; text-align: center;
    }
  </style>
</head>
